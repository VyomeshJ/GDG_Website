name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gdg-website-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gdg-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy container
        run: docker compose up -d --no-build --remove-orphans

      - name: Verify service
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://localhost:3006/ > /dev/null; then
              echo "GDG website is available on port 3006."
              exit 0
            fi
            sleep 2
          done

          docker compose logs --no-color web
          exit 1
