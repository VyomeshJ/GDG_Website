name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gdg-website-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and deploy
        run: docker compose up -d --build --remove-orphans

      - name: Verify service
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://localhost:3006/ > /dev/null; then
              echo "GDG website is available on port 3006."
              exit 0
            fi
            sleep 1
          done

          docker compose logs --no-color web
          exit 1
